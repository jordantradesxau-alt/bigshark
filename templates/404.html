<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Big Shark Apparel</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='files/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='files/css/lightslider.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='files/css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/bigshark.png?v=2') }}">

    <style>
        body {
            background-color: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .error-container {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 60px 50px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .error-container h1 {
            font-size: 6rem;
            font-weight: 800;
            color: #d4af37;
            margin: 0;
            line-height: 1;
        }

        .error-container h2 {
            color: #fff;
            font-size: 1.8rem;
            margin: 10px 0;
        }

        .error-container p {
            color: #888;
            font-size: 1.1rem;
        }

        .error-container a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .error-container a:hover {
            color: #f5e6b0;
            text-decoration: underline;
        }

        .error-container .shark-icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 40px 24px;
            }
            .error-container h1 {
                font-size: 4rem;
            }
            .error-container h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="shark-icon">🦈</span>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <br>
        <a href="/">← Return to Homepage</a>
    </div>
</body>
</html>
