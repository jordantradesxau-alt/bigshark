<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link rel="stylesheet" href="../static/files/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/files/css/lightslider.css">
    <link rel="stylesheet" href="../static/files/css/style.css">

    <link rel="icon" href="../static/images/bigshark.png?v=2">

    <script src="../static/files/js/bootstrap.min.js"></script>
    <script src="../static/files/js/jquery.js"></script>
    <script src="../static/files/js/lightslider.js"></script>
    <script src="../static/files/js/script.js"></script>

    <style>
        body{
            background-image:url(../static/images/bigshark.jpg);
            background-attachment:fixed;
        }

        .luxury-heading.silver{
            background:linear-gradient(
                270deg,
                #000000,
                #1c1c1c,
                #c0c0c0,
                #e5e5e5,
                #c0c0c0,
                #1c1c1c,
                #000000
            );

            background-size:600% 600%;
            color:#eaeaea;
            padding:15px;
        }

        .checkout-card{
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.08);
            padding:25px;
            border-radius:15px;
        }

        .checkout-card h3{
            color:#d4af37;
        }

        .checkout-card .form-control{
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            color:#fff;
            border-radius:10px;
            padding:12px 16px;
        }

        .checkout-card .form-control:focus{
            border-color:#d4af37;
            box-shadow:0 0 0 3px rgba(212,175,55,0.15);
            outline:none;
        }

        .checkout-card .form-control::placeholder{
            color:rgba(255,255,255,0.3);
        }

        .checkout-card label{
            color:rgba(255,255,255,0.7);
            font-weight:500;
        }

        .order-summary-item{
            border-bottom:1px solid rgba(255,255,255,0.05);
            padding:8px 0;
        }

        .order-summary-item:last-child{
            border-bottom:none;
        }

        .btn-gold{
            background:linear-gradient(135deg, #d4af37, #b8962e);
            border:none;
            color:#fff;
            font-weight:600;
            transition:all 0.3s ease;
            padding:12px 30px;
            border-radius:8px;
            width:100%;
        }

        .btn-gold:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 25px rgba(212,175,55,0.3);
            color:#fff;
        }

        .text-gold{ color:#d4af37; }
        .text-muted-light{ color:rgba(255,255,255,0.5); }
    </style>
</head>

<body>

<h1 class="text-center luxury-heading silver">
    BIG SHARK APPAREL
</h1>

<hr>

{% include 'navbar.html' %}

<br>

<div class="container">

    <div class="row">

        <div class="col-md-7">

            <div class="checkout-card">

                <h3 class="mb-4">
                    <i class="fas fa-truck"></i> Delivery Information
                </h3>

                <form action="/place_order" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="customer_name" class="form-control" placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="0712345678" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">County / Location</label>
                        <input type="text" name="location" class="form-control" placeholder="e.g., Nairobi" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea name="address" rows="4" class="form-control" placeholder="Enter your full delivery address..." required></textarea>
                    </div>

                    <button type="submit" class="btn-gold">
                        <i class="fas fa-check-circle"></i> Place Order
                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-5">

            <div class="checkout-card">

                <h3 class="mb-4">
                    <i class="fas fa-receipt"></i> Order Summary
                </h3>

                {% for key,item in cart_items.items() %}
                    <div class="order-summary-item">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-light mb-0">{{ item.name }}</h6>
                                <small class="text-muted-light">Qty: {{ item.qty }}</small>
                            </div>
                            <b class="text-gold">KES {{ item.price }}</b>
                        </div>
                    </div>
                {% endfor %}

                <hr style="border-color:rgba(255,255,255,0.05);">

                <div class="d-flex justify-content-between">
                    <h4 class="text-light">Total</h4>
                    <h4 class="text-gold">KES {{ total }}</h4>
                </div>

            </div>

        </div>

    </div>

</div>

<br><br>

{% include 'help.html' %}

<footer class="bg-dark text-center text-white p-3">
    <b>Big Shark © 2026</b>
</footer>

</body>
</html>
