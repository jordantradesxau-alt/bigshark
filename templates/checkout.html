```
<div class="row">

    <div class="col-md-7">

        <div class="checkout-card">

            <h3 class="mb-4">
                Delivery Information
            </h3>

            <form action="/place_order" method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           name="customer_name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email Address
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        County / Location
                    </label>

                    <input type="text"
                           name="location"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Delivery Address
                    </label>

                    <textarea name="address"
                              rows="4"
                              class="form-control"
                              required></textarea>
                </div>

                <button type="submit"
                        class="btn btn-success btn-lg">
                    Place Order
                </button>

            </form>

        </div>

    </div>

    <div class="col-md-5">

        <div class="checkout-card">

            <h3 class="mb-4">
                Order Summary
            </h3>

            {% for key,item in cart_items.items() %}

                <div class="border-bottom mb-3 pb-2">

                    <h6>
                        {{ item.name }}
                    </h6>

                    <small>
                        Qty: {{ item.qty }}
                    </small>

                    <br>

                    <b>
                        KES {{ item.price }}
                    </b>

                </div>

            {% endfor %}

            <hr>

            <h4>
                Total: KES {{ total }}
            </h4>

        </div>

    </div>

</div>
```
